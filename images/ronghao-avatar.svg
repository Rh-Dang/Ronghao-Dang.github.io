<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Ronghao Dang</title>
  <desc id="desc">Monogram avatar with the initials RD and Chinese name 党荣浩</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6f2118"/>
      <stop offset="1" stop-color="#b85a45"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="200" fill="url(#grid)"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  <text x="200" y="210" fill="#fff" font-family="Arial, sans-serif" font-weight="700" font-size="128" text-anchor="middle" letter-spacing="-8">RD</text>
  <path d="M105 245H295" stroke="#f0d4a6" stroke-width="4"/>
  <text x="200" y="286" fill="#f0d4a6" font-family="Microsoft YaHei, sans-serif" font-weight="600" font-size="30" text-anchor="middle" letter-spacing="8">党荣浩</text>
</svg>
